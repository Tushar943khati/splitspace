
<!DOCTYPE html>
<html lang="en">
<head>
    <title>SplitSpace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            margin: 0;
            color: #222;
        }

        header {
            background: #4338ca;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input, select, textarea, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #4338ca;
            color: white;
            cursor: pointer;
            border: none;
        }

        .post {
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        .tag {
            background: #e0e7ff;
            padding: 5px;
            border-radius: 5px;
        }

        .comment {
            background: #f1f5f9;
            padding: 8px;
            margin: 5px 0;
        }

        .danger {
            background: #dc2626;
        }

        .like {
            background: #0f766e;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SplitSpace</h1>
    <p>Share expenses and contributions with your group</p>
</header>

<div class="container">

    <!-- REGISTER AND LOGIN -->
    <div class="card" id="loginBox">
        <h2>Register / Login</h2>

        <input type="text" id="name" placeholder="Enter your name">
        <input type="password" id="password" placeholder="Enter password">

        <button onclick="login()">Register / Login</button>
    </div>

    <!-- PROFILE -->
    <div class="card hidden" id="profile">
        <h2>Your Profile</h2>
        <p id="profileName"></p>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- CREATE CONTRIBUTION -->
    <div class="card hidden" id="createBox">
        <h2 id="heading">Create Contribution</h2>

        <input type="text" id="title" placeholder="Expense title">

        <input type="number" id="amount" placeholder="Amount in rupees">

        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
        </select>

        <textarea id="description"
            placeholder="Describe the expense"></textarea>

        <button id="saveButton" onclick="savePost()">
            Add Contribution
        </button>

        <button id="cancelButton" class="hidden"
            onclick="cancelEdit()">Cancel Edit</button>
    </div>

    <!-- SEARCH AND FILTER -->
    <div class="card hidden" id="searchBox">
        <h2>Find Contributions</h2>

        <input type="text" id="search"
            placeholder="Search title or person"
            oninput="showPosts()">

        <select id="filter" onchange="showPosts()">
            <option>All</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
        </select>

        <label>
            <input type="checkbox" id="admin"
                onchange="showPosts()" style="width:auto">
            Demo Admin Mode
        </label>

        <p>Admin mode lets you remove other users' posts.</p>
    </div>

    <!-- SUMMARY -->
    <div class="card hidden" id="summary">
        <h2>Group Summary</h2>
        <p>Total contributions: <span id="total">0</span></p>
        <p>Total likes: <span id="likes">0</span></p>
        <p>Total reports: <span id="reports">0</span></p>
    </div>

    <!-- CONTRIBUTIONS -->
    <div class="card hidden" id="postsBox">
        <h2>Group Contributions</h2>
        <div id="posts"></div>
    </div>

</div>

<script>
    // All contributions are stored in this array.
    let posts = [];
    let currentUser = "";
    let editId = 0;
    let nextId = 1;

    // REGISTER / LOGIN
    function login() {
        let name = document.getElementById("name").value.trim();
        let password = document.getElementById("password").value;

        if (name === "" || password === "") {
            alert("Enter your name and password.");
            return;
        }

        currentUser = name;

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("profile").classList.remove("hidden");
        document.getElementById("createBox").classList.remove("hidden");
        document.getElementById("searchBox").classList.remove("hidden");
        document.getElementById("summary").classList.remove("hidden");
        document.getElementById("postsBox").classList.remove("hidden");

        document.getElementById("profileName").innerText =
            "Logged in as: " + currentUser;

        showPosts();
        updateSummary();
    }

    function logout() {
        currentUser = "";

        document.getElementById("loginBox").classList.remove("hidden");
        document.getElementById("profile").classList.add("hidden");
        document.getElementById("createBox").classList.add("hidden");
        document.getElementById("searchBox").classList.add("hidden");
        document.getElementById("summary").classList.add("hidden");
        document.getElementById("postsBox").classList.add("hidden");

        cancelEdit();
    }

    // ADD OR UPDATE A CONTRIBUTION
    function savePost() {
        let title = document.getElementById("title").value.trim();
        let amountText = document.getElementById("amount").value;
        let amount = Number(amountText);
        let category = document.getElementById("category").value;
        let description = document.getElementById("description").value.trim();

        if (title === "" || description === "" ||
            amountText === "" || amount < 0) {
            alert("Fill in all fields with a valid amount.");
            return;
        }

        if (editId === 0) {
            let post = {
                id: nextId,
                title: title,
                amount: amount,
                category: category,
                description: description,
                author: currentUser,
                likes: 0,
                reports: 0,
                comments: []
            };

            posts.push(post);
            nextId = nextId + 1;
        } else {
            for (let i = 0; i < posts.length; i++) {
                if (posts[i].id === editId &&
                    posts[i].author === currentUser) {
                    posts[i].title = title;
                    posts[i].amount = amount;
                    posts[i].category = category;
                    posts[i].description = description;
                }
            }

            cancelEdit();
        }

        clearForm();
        showPosts();
        updateSummary();
    }

    function clearForm() {
        document.getElementById("title").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("category").value = "Food";
        document.getElementById("description").value = "";
    }

    // EDIT A CONTRIBUTION
    function editPost(id) {
        for (let i = 0; i < posts.length; i++) {
            if (posts[i].id === id &&
                posts[i].author === currentUser) {
                editId = id;

                document.getElementById("title").value = posts[i].title;
                document.getElementById("amount").value = posts[i].amount;
                document.getElementById("category").value = posts[i].category;
                document.getElementById("description").value = posts[i].description;

                document.getElementById("heading").innerText = "Edit Contribution";
                document.getElementById("saveButton").innerText = "Save Changes";
                document.getElementById("cancelButton").classList.remove("hidden");
            }
        }
    }

    function cancelEdit() {
        editId = 0;
        document.getElementById("heading").innerText = "Create Contribution";
        document.getElementById("saveButton").innerText = "Add Contribution";
        document.getElementById("cancelButton").classList.add("hidden");
        clearForm();
    }

    // DELETE A CONTRIBUTION
    function deletePost(id) {
        for (let i = 0; i < posts.length; i++) {
            if (posts[i].id === id) {
                let isAdmin = document.getElementById("admin").checked;
                let isOwner = posts[i].author === currentUser;

                if (isOwner || isAdmin) {
                    if (confirm("Delete this contribution?")) {
                        posts.splice(i, 1);
                        showPosts();
                        updateSummary();
                    }
                } else {
                    alert("You can delete only your own posts.");
                }

                return;
            }
        }
    }

    // LIKE A CONTRIBUTION
    function likePost(id) {
        for (let i = 0; i < posts.length; i++) {
            if (posts[i].id === id) {
                posts[i].likes = posts[i].likes + 1;
            }
        }

        showPosts();
        updateSummary();
    }

    // REPORT A CONTRIBUTION
    function reportPost(id) {
        for (let i = 0; i < posts.length; i++) {
            if (posts[i].id === id) {
                posts[i].reports = posts[i].reports + 1;
            }
        }

        alert("Contribution reported for review.");
        showPosts();
        updateSummary();
    }

    // ADD A COMMENT OR REPLY
    function addComment(id) {
        let comment = document.getElementById("comment" + id).value.trim();

        if (comment === "") {
            alert("Write a comment first.");
            return;
        }

        for (let i = 0; i < posts.length; i++) {
            if (posts[i].id === id) {
                posts[i].comments.push(currentUser + ": " + comment);
            }
        }

        showPosts();
    }

    // DISPLAY POSTS AND APPLY SEARCH/FILTER
    function showPosts() {
        let output = "";
        let search = document.getElementById("search").value.toLowerCase();
        let filter = document.getElementById("filter").value;
        let isAdmin = document.getElementById("admin").checked;
        let count = 0;

        for (let i = 0; i < posts.length; i++) {
            let post = posts[i];

            let matchesSearch =
                post.title.toLowerCase().includes(search) ||
                post.author.toLowerCase().includes(search);

            let matchesCategory =
                filter === "All" || post.category === filter;

            if (matchesSearch && matchesCategory) {
                count = count + 1;

                output += "<div class='post'>";
                output += "<h3>" + escapeHTML(post.title) + "</h3>";
                output += "<span class='tag'>" + escapeHTML(post.category) + "</span>";
                output += "<p>Amount: ₹" + post.amount.toFixed(2) + "</p>";
                output += "<p>" + escapeHTML(post.description) + "</p>";
                output += "<p>Posted by: " + escapeHTML(post.author) + "</p>";

                if (post.author === currentUser) {
                    output += "<button onclick='editPost(" + post.id + ")'>Edit</button>";
                    output += "<button class='danger' onclick='deletePost(" + post.id + ")'>Delete</button>";
                } else if (isAdmin) {
                    output += "<button class='danger' onclick='deletePost(" + post.id + ")'>Admin Delete</button>";
                }

                output += "<button class='like' onclick='likePost(" + post.id + ")'>Like (" + post.likes + ")</button>";
                output += "<button class='danger' onclick='reportPost(" + post.id + ")'>Report (" + post.reports + ")</button>";

                output += "<h4>Comments / Replies</h4>";

                for (let j = 0; j < post.comments.length; j++) {
                    output += "<p class='comment'>" +
                        escapeHTML(post.comments[j]) + "</p>";
                }

                output += "<input id='comment" + post.id +
                    "' placeholder='Write a comment'>";
                output += "<button onclick='addComment(" + post.id +
                    ")'>Add Comment</button>";

                output += "</div>";
            }
        }

        if (count === 0) {
            output = "<p>No contributions found.</p>";
        }

        document.getElementById("posts").innerHTML = output;
    }

    // UPDATE THE SUMMARY
    function updateSummary() {
        let totalLikes = 0;
        let totalReports = 0;

        for (let i = 0; i < posts.length; i++) {
            totalLikes = totalLikes + posts[i].likes;
            totalReports = totalReports + posts[i].reports;
        }

        document.getElementById("total").innerText = posts.length;
        document.getElementById("likes").innerText = totalLikes;
        document.getElementById("reports").innerText = totalReports;
    }

    // Keep entered text from being interpreted as HTML.
    function escapeHTML(text) {
        return text
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>

</body>
</html>
